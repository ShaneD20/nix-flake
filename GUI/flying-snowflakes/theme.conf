[General]
# Blur the flakes behind the glass panels (needs Qt 6.5+). Set to false on slow GPUs.
blur=true

# Font families. Install them system-wide; Qt falls back to the default sans/mono if missing.
displayFont=Chakra Petch
monoFont=IBM Plex Mono

# Clock. Leave timeFormat empty to follow the locale, or use a Qt format such as HH:mm or h:mm AP.
timeFormat=
dateFormat=dddd, MMMM d
